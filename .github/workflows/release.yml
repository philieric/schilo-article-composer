name: Release

# Sur chaque tag "vX.Y.Z" pousse : build le MSI et publie la GitHub Release avec
# le MSI attache, sans authentification locale (le GITHUB_TOKEN du workflow suffit).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifier que le tag correspond a la version du csproj
        id: version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          [xml]$csproj = Get-Content SchiloArticleComposer.csproj
          $csprojVersion = $csproj.Project.PropertyGroup.Version | Select-Object -First 1
          if ($tagVersion -ne $csprojVersion) {
            Write-Error "Le tag ($tagVersion) ne correspond pas a <Version> dans le csproj ($csprojVersion)."
            exit 1
          }
          "version=$tagVersion" >> $env:GITHUB_OUTPUT

      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publier l'application
        run: dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - name: Installer WiX v5
        id: wix
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $wixExe = Join-Path $env:USERPROFILE ".dotnet\tools\wix.exe"
          if (-not (Test-Path $wixExe)) {
            Write-Error "wix.exe introuvable a l'emplacement attendu : $wixExe"
            exit 1
          }
          & $wixExe --version
          & $wixExe extension add WixToolset.UI.wixext/5.0.2
          "wixExe=$wixExe" >> $env:GITHUB_OUTPUT

      - name: Construire le MSI
        working-directory: installer
        shell: pwsh
        run: |
          & "${{ steps.wix.outputs.wixExe }}" build Product.wxs -ext WixToolset.UI.wixext -arch x64 -d "AppVersion=${{ steps.version.outputs.version }}" -d "PublishDir=../publish" -o SchiloArticleComposer.msi

      - name: Publier la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: installer/SchiloArticleComposer.msi
          generate_release_notes: true
