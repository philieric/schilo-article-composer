name: Release

# Sur chaque tag "vX.Y.Z" pousse : build le MSI et publie la GitHub Release avec
# le MSI attache, sans authentification locale (le GITHUB_TOKEN du workflow suffit).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifier que le tag correspond a la version du csproj
        id: version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          [xml]$csproj = Get-Content SchiloArticleComposer.csproj
          $csprojVersion = $csproj.Project.PropertyGroup.Version | Select-Object -First 1
          if ($tagVersion -ne $csprojVersion) {
            Write-Error "Le tag ($tagVersion) ne correspond pas a <Version> dans le csproj ($csprojVersion)."
            exit 1
          }
          "version=$tagVersion" >> $env:GITHUB_OUTPUT

      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publier l'application
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Installer WiX v5
        id: wix
        working-directory: installer
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $wixExe = Join-Path $env:USERPROFILE ".dotnet\tools\wix.exe"
          if (-not (Test-Path $wixExe)) {
            Write-Error "wix.exe introuvable a l'emplacement attendu : $wixExe"
            exit 1
          }
          & $wixExe --version
          # "wix extension add" enregistre l'extension dans le dossier courant (comme un
          # manifeste dotnet tool) : doit tourner dans le MEME working-directory que
          # "wix build" (installer/), sinon WIX0144 "extension could not be found".
          & $wixExe extension add WixToolset.UI.wixext/5.0.2
          "wixExe=$wixExe" >> $env:GITHUB_OUTPUT

      - name: Construire le MSI
        working-directory: installer
        shell: pwsh
        run: |
          & "${{ steps.wix.outputs.wixExe }}" build Product.wxs -ext WixToolset.UI.wixext -arch x64 -d "AppVersion=${{ steps.version.outputs.version }}" -d "PublishDir=../publish" -o SchiloArticleComposer.msi

      - name: Publier la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: installer/SchiloArticleComposer.msi
          generate_release_notes: true

      # L'app lit ce fichier via raw.githubusercontent.com (CDN, pas de limite de
      # requetes anonymes pratique) plutot que l'API releases/latest (60 req/h par IP
      # anonyme, epuisee a plusieurs reprises en usage reel -> "pas de mise a jour"
      # trompeur). Le lien de telechargement du MSI est reconstruit de maniere
      # previsible (releases/download/vX.Y.Z/...), egalement hors de l'API.
      - name: Publier latest-version.txt sur main (pour la verification de mise a jour)
        shell: pwsh
        run: |
          git fetch origin main
          git checkout main
          "${{ steps.version.outputs.version }}" | Out-File -FilePath latest-version.txt -NoNewline -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-version.txt
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "latest-version.txt deja a jour, rien a committer."
          } else {
            git commit -m "Publie la version ${{ steps.version.outputs.version }} dans latest-version.txt"
            git push origin main
          }
